# HARDGATE nightly formation rebake.
# After London close (~21:30 UTC) walk the rolling 40-day 1h book and retune
# OMNIROUTE / OMNIPRESENT / OMNIGOLD 1 + 19 desk tabs (demote/tighten only).
name: HARDGATE Nightly Formation

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hardgate-formation-nightly
  cancel-in-progress: false

jobs:
  rebake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebake the day book
        run: node scripts/nightly-formation-rebake.mjs --bars=960

      - name: Commit the overlay if it changed
        run: |
          git config user.name "hardgate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/formation-nightly.json
          git diff --cached --quiet || { git commit -m "chore: nightly formation overlay [skip ci]"; git pull --rebase origin main; git push; }
