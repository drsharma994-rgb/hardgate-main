name: HARDGATE Alert Notify

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hardgate-alert-notify
  cancel-in-progress: false

jobs:
  check-and-notify:
    if: ${{ github.event_name != 'schedule' || vars.RENDER_DISPATCH_PRIMARY != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Puppeteer
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: |
          npm ci
          test -d node_modules/puppeteer
          npx --no-install puppeteer browsers install chrome
          node -e "import('puppeteer').then(() => console.log('puppeteer ok')).catch((e) => { console.error(e); process.exit(1); })"

      - name: Run alert check against the live site
        run: node scripts/alert-check.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DISABLED: "0"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit updated alert state if it changed
        run: |
          git config user.name "hardgate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alert-state.json
          git diff --cached --quiet || git commit -m "chore: update alert state [skip ci]"
          git push
