# BATCH 1132 — the scan queues the next scan itself.
# GitHub's cron has not been starting this workflow, and the chat clock
# was marking the slot done without launching a run. The job sends Telegram,
# then waits 9 minutes and dispatches the next run. A newer run already
# waiting means this one does not start a second chain.
name: HARDGATE Golden Telegram

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: hardgate-golden-telegram
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send new golden crosses and composite +5/5 !GOLDEN
        run: node scripts/golden-30m.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DISABLED: "0"
          GOLDEN_ALERT_EVERY_MIN: "10"
      - name: Commit golden alert state if it changed
        run: |
          git config user.name "hardgate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add golden-alert-state.json
          git diff --cached --quiet || git commit -m "chore: golden alert state [skip ci]"
          git push
      - name: Queue the next scan
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "this scan is done; next scan is queued in 9 minutes"
          sleep 540
          NEWER=$(gh run list --repo "${{ github.repository }}" --workflow golden-telegram.yml --limit 20 --json databaseId,status --jq "[.[] | select(.databaseId > ${{ github.run_id }} and (.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\" or .status==\"requested\"))] | length")
          if [ "$NEWER" != "0" ]; then
            echo "a newer run is already waiting; not starting a second chain"
            exit 0
          fi
          gh workflow run golden-telegram.yml --repo "${{ github.repository }}" --ref main
          echo "next scan dispatched"
