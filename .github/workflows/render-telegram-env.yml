# One-click: push TELEGRAM_TOKEN (+ optional TELEGRAM_CHAT_ID) from GitHub secrets to Render hardgate-main.
# Prerequisites: repo secrets RENDER_API_KEY, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID
name: Render Telegram env

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set TELEGRAM_* on Render and redeploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRIGGER_DEPLOY: '1'
        run: node scripts/set-render-telegram-env.mjs
