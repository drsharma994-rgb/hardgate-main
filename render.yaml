# HARDGATE on Render — one-click blueprint.
# Creates:
#   1) hardgate-main — web (static app + /api/proxy + /api/execute)
#   2) hardgate-daemon — background worker (app.js 24/7 brain + CCXT loop)
# Set EXECUTE_CCXT_* on the worker (and web if using /api/execute proxy).
# Default HARDGATE_DAEMON_DRY_RUN=1 until you confirm keys + disable dry run.
services:
  - type: web
    name: hardgate-main
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: node scripts/server.mjs
    autoDeploy: true
    healthCheckPath: /
  - type: worker
    name: hardgate-daemon
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: node app.js
    autoDeploy: true
    envVars:
      - key: HARDGATE_URL
        value: https://hardgate-main.onrender.com/
      - key: HARDGATE_DAEMON_DRY_RUN
        value: "1"
      - key: HARDGATE_STATE_FILE
        value: /var/data/hardgate-daemon-state.json
      - key: NODE_ENV
        value: production
    disk:
      name: hardgate-daemon-state
      mountPath: /var/data
      sizeGB: 1
