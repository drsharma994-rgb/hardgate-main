# HARDGATE on Render — one-click blueprint.
# Creates:
#   1) hardgate-main — web (static app + /api/proxy)
#   2) hardgate-daemon — background worker (app.js 24/7 brain + alerts)
#
# LIVE EXECUTION IS DISABLED IN SOURCE. app.js carries
# HG_DAEMON_EXECUTION_ENABLED = false, so the CCXT executor is never even
# constructed and no broker call is possible regardless of environment.
# Do NOT set EXECUTE_CCXT_* here — nothing would read it, and it would only
# create the false impression that this deployment can trade. Orders are placed
# BY HAND on Delta; this stack is signal + paper-measurement only.
# Guarded by tests/test-no-live-trading.mjs (browser path AND daemon path).
services:
  - type: web
    name: hardgate-main
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci
    startCommand: node scripts/server.mjs
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: XM_MT5_URL
        sync: false
      - key: XM_MT5_TOKEN
        sync: false
      - key: XM_GOLD_SYMBOL
        value: XAUUSD
      - key: CCXT_MARKET_EXCHANGE
        value: binanceusdm
      - key: CCXT_MARKET_SYMBOLS
        value: BTC/USDT:USDT,ETH/USDT:USDT
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_DISABLED
        value: "1"
  - type: worker
    name: hardgate-daemon
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci && npx puppeteer browsers install chrome
    startCommand: node app.js
    autoDeploy: true
    envVars:
      - key: HARDGATE_URL
        value: https://hardgate-main.onrender.com/
      - key: HARDGATE_DAEMON_DRY_RUN
        value: "1"
      - key: CCXT_MARKET_EXCHANGE
        value: binanceusdm
      - key: CCXT_MARKET_SYMBOLS
        value: BTC/USDT:USDT,ETH/USDT:USDT
      - key: HARDGATE_STATE_FILE
        value: /var/data/hardgate-daemon-state.json
      - key: NODE_ENV
        value: production
    disk:
      name: hardgate-daemon-state
      mountPath: /var/data
      sizeGB: 1
