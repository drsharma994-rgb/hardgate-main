# HARDGATE on Render — one-click blueprint.
# Creates:
#   1) hardgate-main — web (static app + /api/proxy)
#   2) hardgate-daemon — background worker (app.js 24/7 brain + alerts)
#
# LIVE EXECUTION IS DISABLED IN SOURCE. app.js carries
# HG_DAEMON_EXECUTION_ENABLED = false, so the CCXT executor is never even
# constructed and no broker call is possible regardless of environment.
# Do NOT set EXECUTE_CCXT_* here — nothing would read it, and it would only
# create the false impression that this deployment can trade. Crypto orders
# are placed BY HAND on Delta; that stack is signal + paper-measurement only.
# Guarded by tests/test-no-live-trading.mjs (browser path AND daemon path).
#
# OMNIGOLD → XM gold lots is a SEPARATE path (not CCXT). Default DRY RUN.
# Live gold orders require XM_OMNIGOLD_LIVE=1 + HARDGATE_API_SECRET + the
# header API key. HARDGATE_KILL_SWITCH / HARDGATE_TRADING_HALT still halt.
services:
  - type: web
    name: hardgate-main
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci
    startCommand: node scripts/server.mjs
    autoDeploy: true
    healthCheckPath: /
    envVars:
      # Pin the runtime. package.json said only ">=18", so Render was free to
      # pick any future major and change the runtime under a deployed trading
      # desk without a commit. Raise this deliberately, not by drift.
      - key: NODE_VERSION
        value: "22.11.0"
      - key: GEMINI_API_KEY
        sync: false
      - key: XM_MT5_URL
        sync: false
      - key: XM_MT5_TOKEN
        sync: false
      - key: XM_GOLD_SYMBOL
        value: XAUUSD
      - key: XM_OMNIGOLD_LIVE
        value: "0"
      - key: XM_OMNIGOLD_LOTS
        value: "0.01"
      - key: XM_OMNIGOLD_MAX_LOTS
        value: "0.10"
      - key: HARDGATE_API_SECRET
        sync: false
      - key: CCXT_MARKET_EXCHANGE
        value: binanceusdm
      - key: CCXT_MARKET_SYMBOLS
        value: BTC/USDT:USDT,ETH/USDT:USDT
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_DISABLED
        value: "1"
  - type: worker
    name: hardgate-daemon
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci && npx puppeteer browsers install chrome
    startCommand: node app.js
    autoDeploy: true
    envVars:
      # Same pin as the web service. The daemon also builds Chrome for
      # puppeteer, which is the most runtime-sensitive step in the stack.
      - key: NODE_VERSION
        value: "22.11.0"
      - key: HARDGATE_URL
        value: https://hardgate-main.onrender.com/
      - key: HARDGATE_DAEMON_DRY_RUN
        value: "1"
      - key: CCXT_MARKET_EXCHANGE
        value: binanceusdm
      - key: CCXT_MARKET_SYMBOLS
        value: BTC/USDT:USDT,ETH/USDT:USDT
      - key: HARDGATE_STATE_FILE
        value: /var/data/hardgate-daemon-state.json
      - key: NODE_ENV
        value: production
    disk:
      name: hardgate-daemon-state
      mountPath: /var/data
      sizeGB: 1
